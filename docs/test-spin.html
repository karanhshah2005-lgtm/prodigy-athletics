<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spin3d — 360° rashguard viewer test</title>
<link rel="stylesheet" href="../src/brand.css">
<script type="importmap">
{"imports":{
  "three":"../vendor/three/three.module.js",
  "three/addons/":"../vendor/three/addons/"
}}
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin:0; background:#0B1220; color:#F5F3EE;
    font:14px/1.45 Barlow,'Segoe UI',system-ui,sans-serif;
    padding:18px 20px 60px;
  }
  h1 { font-size:18px; letter-spacing:.06em; text-transform:uppercase; margin:0 0 4px; }
  p.note { color:#9aa4b5; margin:0 0 14px; font-size:12px; }
  .row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .card { background:#11172400; border:1px solid #1e2838; border-radius:10px; padding:10px; width:340px; }
  .card h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; color:#E8A33D; }
  .stage { width:320px; height:440px; border-radius:8px; overflow:hidden;
           background:radial-gradient(120% 90% at 50% 20%, #202a3b 0%, #0d131d 70%); }
  .stage.light { background:radial-gradient(120% 90% at 50% 20%, #ffffff 0%, #d9dde4 75%); }
  .stagewrap { position:relative; }
  .hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#E8A33D;
          opacity:.6; font:500 12px/1.5 'IBM Plex Mono',ui-monospace,monospace; letter-spacing:.12em;
          transition:opacity 240ms cubic-bezier(.4,0,.2,1); pointer-events:none; }
  .hint.gone { opacity:0; }
  .ctl { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#1b2434; color:#F5F3EE; border:1px solid #2b374b; border-radius:6px;
           padding:5px 9px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { background:#25324a; }
  button.on { background:#E8A33D; color:#0B1220; border-color:#E8A33D; }
  .stat { font:11px/1.4 ui-monospace,Consolas,monospace; color:#7f8b9e; margin-top:6px; white-space:pre; }
  .card.wide { width:auto; max-width:760px; }
  .side { display:flex; gap:12px; align-items:flex-start; }
  .flats { display:flex; flex-direction:column; gap:8px; }
  .flats > div { width:214px; height:214px; background:#0d131d; border:1px solid #1e2838; border-radius:6px; }
  .flats > div svg { display:block; width:100%; height:100%; }
  .flats span { display:block; font:11px/1.6 ui-monospace,Consolas,monospace; color:#7f8b9e; }
  #shots { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  #shots img { width:200px; border:1px solid #23303f; border-radius:6px; background:#0d131d; }
  .bar { margin:12px 0 8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         border-top:1px solid #1e2838; padding-top:10px; }
  .bar b { font:600 11px/1 Barlow; letter-spacing:.14em; text-transform:uppercase; color:#5f6b7e; margin-right:2px; }
</style>
</head>
<body>
<h1>spin3d — 360° rashguard viewer</h1>
<p class="note">Garment lofted over an implicit male size-M body (1.75 m), grey bust form.
Sample data only — no real SKUs or prices.</p>

<div class="bar">
  <b>azimuth</b>
  <button data-az="0">0°</button>
  <button data-az="45">45°</button>
  <button data-az="90">90°</button>
  <button data-az="135">135°</button>
  <button data-az="180">180°</button>
  <b style="margin-left:12px">polar</b>
  <button data-po="70">70°</button>
  <button data-po="82">82°</button>
  <button data-po="96">96°</button>
</div>
<div class="bar">
  <b>toggles</b>
  <button id="mann" class="on">mannequin: grey</button>
  <button id="wrink" class="on">wrinkles: on</button>
  <button id="allOn">auto-rotate ALL on</button>
  <button id="allOff">off</button>
  <button id="shotAll">snapshot all</button>
  <button id="fpsBtn">measure fps (3s)</button>
  <span class="stat" id="fpsAll"></span>
</div>

<div class="row" id="row"></div>
<div id="shots"></div>

<script type="module">
import { mountSpin } from '../src/render/spin3d.js';
import { demoArt, artPatternDef, artPatternRef, DEFAULT_TRANSFORM } from '../src/render/art.js';
import { lockupSVG } from '../src/render/marks.js';
import { BELT_HEX, renderGarment, renderRanked, slotsFor } from './../src/render/garment.js';
import { svgToPng } from '../src/render/export.js';

const art = demoArt('geo', 300);

// chestMarkSvg proof: the SAME lockupSVG() the 2D renderer calls, wrapped in an <svg>
// and handed to the viewer as a data URL. Nothing is re-drawn with a font.
const LOCKUP_SVG_URL = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 620 200">`
  + lockupSVG({ x: 310, y: 100, width: 600, color: '#F5F3EE' }) + `</svg>`);

const CONFIGS = [
  { id:'ls-black', title:'Black LS — sleeve run + chest lockup', light:false, opts:{
      style:'ls', baseColor:'#14161b', sleeveText:'PRODIGY', sleeveTextColor:'#F5F3EE',
      chestMark:'lockup', chestMarkColor:'#E8A33D', backText:null,
      mannequin:'grey', speed:0.6, dragHint:true } },
  { id:'ss-white', title:"White SS — 'mono' + tiled demo art", light:true, opts:{
      style:'ss', baseColor:'#ECECEA', art, artTile:3, sleeveText:'PRODIGY',
      sleeveTextColor:'#0B1220', chestMark:'mono', chestMarkColor:'#E8A33D',
      chestMarkBg:'#0B1220', mannequin:'grey', speed:0.6, dragHint:true } },
  { id:'ls-blue', title:'Ranked blue LS — belt sleeves + back print', light:false, opts:{
      style:'ls', baseColor:'#14161b', sleeveColor: (BELT_HEX && BELT_HEX.blue) || '#004ABE',
      sleeveText:'PRODIGY', sleeveTextColor:'#F5F3EE',
      chestMark:null, chestMarkSvg: LOCKUP_SVG_URL, backText:'PRODIGY',
      chestMarkColor:'#F5F3EE', mannequin:'grey', speed:0.6, dragHint:true } },
];

const row = document.getElementById('row');
const views = [];

for (const cfg of CONFIGS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${cfg.title}</h2>
    <div class="stagewrap"><div class="stage${cfg.light ? ' light' : ''}" id="stage-${cfg.id}"></div>
      <div class="hint" id="hint-${cfg.id}">DRAG TO SPIN</div></div>
    <div class="ctl">
      <button data-act="toggle">auto-rotate: on</button>
      <button data-act="shot">snapshot</button>
      <button data-act="style">toggle LS/SS</button>
      <button data-act="art">toggle art</button>
    </div>
    <div class="stat" id="stat-${cfg.id}"></div>`;
  row.appendChild(card);

  const el = card.querySelector('.stage');
  const api = mountSpin(el, cfg.opts);
  const hint = card.querySelector('.hint');
  api.onInteract(() => { hint.classList.add('gone'); });
  const v = { id: cfg.id, api, el, opts: { ...cfg.opts }, rotating: true, hasArt: !!cfg.opts.art };
  views.push(v);

  card.querySelector('[data-act="toggle"]').onclick = (e) => {
    v.rotating = !v.rotating; api.setAutoRotate(v.rotating);
    e.target.textContent = `auto-rotate: ${v.rotating ? 'on' : 'off'}`;
  };
  card.querySelector('[data-act="shot"]').onclick = () => shot(v, 900);
  card.querySelector('[data-act="style"]').onclick = () => {
    v.opts.style = v.opts.style === 'ls' ? 'ss' : 'ls';
    api.update({ style: v.opts.style });
  };
  card.querySelector('[data-act="art"]').onclick = () => {
    v.hasArt = !v.hasArt;
    api.update({ art: v.hasArt ? art : null });
  };
}

/* ── BAKED card: the client scenario ────────────────────────────────────────────
   The user placed art in the studio (all-over at their own scale + rotation, plus a
   single logo dropped in the chest zone) and asked why the 360 does not show it.
   The 2D piece renders (detail:'tex', part:…) ARE the 3D texture, so the flat views
   beside the viewer and the wrapped garment are the same render. ─────────────── */

const BAKE_BASE = '#14161b';
const BAKE_ART = {
  all:   { art: demoArt('geo', 300),  transform: { scale: 0.6, rotate: 20, x: 0, y: 0 }, tile: true },
  chest: { art: demoArt('mark', 300), transform: { scale: 0.55, rotate: 0, x: 0, y: -46 }, tile: false },
};
const BAKE_MARKS = {
  chest:   { kind: 'lockup', color: '#F5F3EE', width: 150 },
  sleeves: { text: 'PRODIGY', color: '#F5F3EE' },
  back:    { kind: 'word', color: '#F5F3EE', width: 250 },
};
const bakeState = { style: 'ls', ranked: false, belt: 'blue' };

function defsAndSlots(style, view, uid) {
  let defs = '', slots = {};
  for (const s of slotsFor(style, view)) {
    const e = BAKE_ART[s.key];
    if (!e || !e.art) continue;
    defs += artPatternDef({ uid, key: s.key, art: e.art, transform: { ...DEFAULT_TRANSFORM, ...e.transform }, tile: e.tile !== false, bbox: s.bbox });
    slots[s.key] = artPatternRef({ uid, key: s.key });
  }
  return { defs, slots };
}
function bakeSvg(view, { size = 1000, detail = 'full', part = null } = {}) {
  const uid = `bk-${view}-${part || 'all'}-${detail}-${bakeState.ranked ? 'r' : 'p'}-${bakeState.style}`;
  const { defs, slots } = defsAndSlots(bakeState.style, view, uid);
  const common = { style: bakeState.style, view, uid, size, detail, defs, slots, part, marks: BAKE_MARKS };
  return bakeState.ranked
    ? renderRanked({ ...common, belt: bakeState.belt, body: 'black' })
    : renderGarment({ ...common, baseColor: BAKE_BASE });
}
const blobToDataUrl = (blob) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result));
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});
async function buildBake() {
  const jobs = [];
  for (const view of ['front', 'back']) {
    for (const part of ['torso', 'sleeveL', 'sleeveR']) {
      const name = part === 'torso' ? view : `${part}${view === 'front' ? 'Front' : 'Back'}`;
      jobs.push(svgToPng(bakeSvg(view, { size: 1024, detail: 'tex', part }), { width: 1024 })
        .then(blobToDataUrl).then(url => [name, url]));
    }
  }
  return Object.fromEntries(await Promise.all(jobs));
}

const bakeCard = document.createElement('div');
bakeCard.className = 'card wide';
bakeCard.innerHTML = `<h2>BAKED — the flat 2D render wrapped onto the 3D</h2>
  <div class="side">
    <div class="stagewrap"><div class="stage" id="stage-bake"></div>
      <div class="hint" id="hint-bake">DRAG TO SPIN</div></div>
    <div class="flats">
      <span>flat FRONT (2D)</span><div id="flatF"></div>
      <span>flat BACK (2D)</span><div id="flatB"></div>
    </div>
  </div>
  <div class="ctl">
    <button data-act="toggle">auto-rotate: off</button>
    <button data-act="shot">snapshot</button>
    <button data-act="style">toggle LS/SS</button>
    <button data-act="ranked">ranked: off</button>
    <button data-act="scale">art scale 0.6</button>
    <button data-act="rot">art rotate 20°</button>
  </div>
  <div class="stat" id="stat-bake">building…</div>`;
row.appendChild(bakeCard);

function drawFlats() {
  document.getElementById('flatF').innerHTML = bakeSvg('front', { size: 214 });
  document.getElementById('flatB').innerHTML = bakeSvg('back', { size: 214 });
}
let bakeView = null;
async function rebake() {
  drawFlats();
  const bake = await buildBake();
  if (!bakeView) return bake;
  bakeView.api.update({ style: bakeState.style, sleeveColor: bakeState.ranked ? BELT_HEX[bakeState.belt] : null, bake });
  return bake;
}
(async () => {
  drawFlats();
  const bake = await buildBake();
  const el = document.getElementById('stage-bake');
  const api = mountSpin(el, {
    style: bakeState.style, baseColor: BAKE_BASE, bake,
    sleeveText: null, chestMark: null, backText: null,
    mannequin: 'grey', speed: 0.6, autoRotate: false, dragHint: true,
  });
  const hint = bakeCard.querySelector('.hint');
  api.onInteract(() => hint.classList.add('gone'));
  bakeView = { id: 'bake', api, el, opts: {}, rotating: false, hasArt: true };
  views.push(bakeView);
  bakeCard.querySelector('[data-act="toggle"]').onclick = (e) => {
    bakeView.rotating = !bakeView.rotating; api.setAutoRotate(bakeView.rotating);
    e.target.textContent = `auto-rotate: ${bakeView.rotating ? 'on' : 'off'}`;
  };
  bakeCard.querySelector('[data-act="shot"]').onclick = () => shot(bakeView, 900);
  bakeCard.querySelector('[data-act="style"]').onclick = () => {
    bakeState.style = bakeState.style === 'ls' ? 'ss' : 'ls';
    rebake();
  };
  bakeCard.querySelector('[data-act="ranked"]').onclick = (e) => {
    bakeState.ranked = !bakeState.ranked;
    e.target.textContent = `ranked: ${bakeState.ranked ? 'blue' : 'off'}`;
    e.target.classList.toggle('on', bakeState.ranked);
    rebake();
  };
  bakeCard.querySelector('[data-act="scale"]').onclick = (e) => {
    BAKE_ART.all.transform.scale = BAKE_ART.all.transform.scale === 0.6 ? 1.2 : 0.6;
    e.target.textContent = `art scale ${BAKE_ART.all.transform.scale}`;
    rebake();
  };
  bakeCard.querySelector('[data-act="rot"]').onclick = (e) => {
    BAKE_ART.all.transform.rotate = BAKE_ART.all.transform.rotate === 20 ? -35 : 20;
    e.target.textContent = `art rotate ${BAKE_ART.all.transform.rotate}°`;
    rebake();
  };
  window.__bake = { rebake, state: bakeState, art: BAKE_ART, svg: bakeSvg, build: buildBake };
  window.__bakeReady = true;
})();

async function shot(v, width = 900) {
  const blob = await v.api.snapshot(width);
  if (!blob) return null;
  const img = new Image();
  img.src = URL.createObjectURL(blob);
  img.title = `${v.id} — ${(blob.size / 1024).toFixed(0)} KB`;
  document.getElementById('shots').appendChild(img);
  return blob;
}

const az = deg => views.forEach(v => { v.api.setAutoRotate(false); v.rotating = false; v.api.setAzimuth(deg * Math.PI / 180); });
const po = deg => views.forEach(v => { v.api.setAutoRotate(false); v.rotating = false; v.api.setPolar(deg * Math.PI / 180); });
for (const b of document.querySelectorAll('[data-az]')) b.onclick = () => az(Number(b.dataset.az));
for (const b of document.querySelectorAll('[data-po]')) b.onclick = () => po(Number(b.dataset.po));

let mann = 'grey', wrink = true;
document.getElementById('mann').onclick = (e) => {
  mann = mann === 'grey' ? 'none' : 'grey';
  e.target.textContent = `mannequin: ${mann}`;
  e.target.classList.toggle('on', mann === 'grey');
  views.forEach(v => v.api.update({ mannequin: mann }));
};
document.getElementById('wrink').onclick = (e) => {
  wrink = !wrink;
  e.target.textContent = `wrinkles: ${wrink ? 'on' : 'off'}`;
  e.target.classList.toggle('on', wrink);
  views.forEach(v => v.api.update({ wrinkles: wrink }));
};
document.getElementById('allOn').onclick = () => views.forEach(v => { v.rotating = true; v.api.setAutoRotate(true); });
document.getElementById('allOff').onclick = () => views.forEach(v => { v.rotating = false; v.api.setAutoRotate(false); });
document.getElementById('shotAll').onclick = () => views.forEach(v => shot(v, 700));
document.getElementById('fpsBtn').onclick = async (e) => {
  e.target.disabled = true;
  views.forEach(v => { v.rotating = true; v.api.setAutoRotate(true); });
  const out = document.getElementById('fpsAll');
  out.textContent = 'measuring…';
  const r = await window.__spin.measureFps(3000);
  out.textContent = `rAF ${r.fps.toFixed(1)} Hz over ${Math.round(r.ms)} ms · rendered: `
    + views.map(v => `${v.id} ${v.api.getInfo().fps} fps / ${v.api.getInfo().triangles} tris`).join(' · ');
  e.target.disabled = false;
};

setInterval(() => {
  for (const v of views) {
    const i = v.api.getInfo();
    const s = document.getElementById(`stat-${v.id}`);
    if (s) s.textContent = `${i.fps} fps(rendered) · ${i.triangles} tris · ${i.drawCalls} calls · ${i.quality} · az ${i.azimuthDeg}° po ${i.polarDeg}°`;
  }
}, 500);

// ── hooks for automated screenshot verification ──
window.__spin = {
  views,
  api: id => (views.find(v => v.id === id) || views[0]).api,
  setAzimuth: (deg, id) => (id ? [views.find(v => v.id === id)] : views)
    .forEach(v => { v.api.setAutoRotate(false); v.rotating = false; v.api.setAzimuth(deg * Math.PI / 180); }),
  setPolar: (deg, id) => (id ? [views.find(v => v.id === id)] : views)
    .forEach(v => v.api.setPolar(deg * Math.PI / 180)),
  autoRotate: on => views.forEach(v => { v.rotating = !!on; v.api.setAutoRotate(!!on); }),
  info: () => views.map(v => ({ id: v.id, ...v.api.getInfo() })),
  update: (opts, id) => (id ? [views.find(v => v.id === id)] : views).forEach(v => v.api.update(opts)),
  snapshot: (id, w = 900) => shot(views.find(v => v.id === id) || views[0], w),
  /** measure fps over `ms` by counting rAF ticks (the viewers render every rAF while visible) */
  measureFps: (ms = 3000) => new Promise(res => {
    let n = 0; const t0 = performance.now();
    const step = () => { n++; (performance.now() - t0 < ms) ? requestAnimationFrame(step) : res({ frames: n, ms: performance.now() - t0, fps: n * 1000 / (performance.now() - t0) }); };
    requestAnimationFrame(step);
  }),
  dispose: () => views.forEach(v => v.api.dispose()),
  hints: () => views.map(v => ({ id: v.id, hidden: document.getElementById(`hint-${v.id}`).classList.contains('gone') })),
  fakeDrag: id => { const v = views.find(x => x.id === id) || views[0];
    v.el.querySelector('canvas').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 })); },
};
window.__spinReady = true;
</script>
</body>
</html>
