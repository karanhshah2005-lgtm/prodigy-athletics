<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spin3d — 360° rashguard viewer test</title>
<link rel="stylesheet" href="../src/brand.css">
<script type="importmap">
{"imports":{
  "three":"../vendor/three/three.module.js",
  "three/addons/":"../vendor/three/addons/"
}}
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin:0; background:#0B1220; color:#F5F3EE;
    font:14px/1.45 Barlow,'Segoe UI',system-ui,sans-serif;
    padding:18px 20px 60px;
  }
  h1 { font-size:18px; letter-spacing:.06em; text-transform:uppercase; margin:0 0 4px; }
  p.note { color:#9aa4b5; margin:0 0 18px; font-size:12px; }
  .row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .card { background:#11172400; border:1px solid #1e2838; border-radius:10px; padding:10px; width:340px; }
  body { font-family:Barlow,'Segoe UI',system-ui,sans-serif; }
  .card h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; color:#E8A33D; }
  .stage { width:320px; height:400px; border-radius:8px; overflow:hidden;
           background:radial-gradient(120% 90% at 50% 20%, #202a3b 0%, #0d131d 70%); }
  .stage.light { background:radial-gradient(120% 90% at 50% 20%, #ffffff 0%, #d9dde4 75%); }
  .stagewrap { position:relative; }
  .hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#E8A33D;
          opacity:.6; font:500 12px/1.5 'IBM Plex Mono',ui-monospace,monospace; letter-spacing:.12em;
          transition:opacity 240ms cubic-bezier(.4,0,.2,1); pointer-events:none; }
  .hint.gone { opacity:0; }
  .ctl { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#1b2434; color:#F5F3EE; border:1px solid #2b374b; border-radius:6px;
           padding:5px 9px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover { background:#25324a; }
  .stat { font:11px/1.4 ui-monospace,Consolas,monospace; color:#7f8b9e; margin-top:6px; white-space:pre; }
  #shots { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  #shots img { width:200px; border:1px solid #23303f; border-radius:6px; background:#0d131d; }
  .bar { margin:14px 0 8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<h1>spin3d — 360° rashguard viewer</h1>
<p class="note">Procedural lofted garment, three.js r170, vendored locally. Sample data only — no real SKUs or prices.</p>

<div class="bar">
  <button id="allOn">auto-rotate ALL on</button>
  <button id="allOff">auto-rotate ALL off</button>
  <button id="shotAll">snapshot all → below</button>
  <button id="a0">azimuth 0° (front)</button>
  <button id="a90">90° (right side)</button>
  <button id="a180">180° (back)</button>
  <button id="a270">270° (left side)</button>
  <button id="a45">45°</button>
  <button id="fpsBtn">measure fps (3s)</button>
  <span class="stat" id="fpsAll"></span>
</div>

<div class="row" id="row"></div>
<div id="shots"></div>

<script type="module">
import { mountSpin } from '../src/render/spin3d.js';
import { demoArt } from '../src/render/art.js';
import { lockupSVG } from '../src/render/marks.js';

const art = demoArt('geo', 300);

// chestMarkSvg proof: the SAME lockupSVG() the 2D renderer calls, wrapped in an <svg>
// and handed to the viewer as a data URL. Nothing is re-drawn with a font.
const LOCKUP_SVG_URL = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 620 200">`
  + lockupSVG({ x: 310, y: 100, width: 600, color: '#F5F3EE' }) + `</svg>`);

const CONFIGS = [
  { id:'ls-black', title:'Black LS — sleeve run + chest lockup', light:false, opts:{
      style:'ls', baseColor:'#14161b', sleeveText:'PRODIGY', sleeveTextColor:'#F5F3EE',
      chestMark:'lockup', chestMarkColor:'#E8A33D', backText:null, speed:0.6, dragHint:true } },
  { id:'ss-white', title:"White SS — 'mono' + tiled demo art", light:true, opts:{
      style:'ss', baseColor:'#ECECEA', art, artTile:3, sleeveText:'PRODIGY',
      sleeveTextColor:'#0B1220', chestMark:'mono', chestMarkColor:'#E8A33D',
      chestMarkBg:'#0B1220', speed:0.6, dragHint:true } },
  { id:'ls-navy', title:'Navy LS — chestMarkSvg + back print', light:false, opts:{
      style:'ls', baseColor:'#0B1220', sleeveText:'PRODIGY', sleeveTextColor:'#E8A33D',
      chestMark:null, chestMarkSvg: LOCKUP_SVG_URL, backText:'PRODIGY',
      chestMarkColor:'#F5F3EE', speed:0.6, dragHint:true } },
  { id:'ls-white', title:'Bone LS — light colourway, no blow-out', light:true, opts:{
      style:'ls', baseColor:'#F4F2EC', sleeveText:'PRODIGY', sleeveTextColor:'#0B1220',
      chestMark:'lockup', chestMarkColor:'#0B1220', speed:0.6, dragHint:true } },
];

const row = document.getElementById('row');
const views = [];

for (const cfg of CONFIGS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${cfg.title}</h2>
    <div class="stagewrap"><div class="stage${cfg.light ? ' light' : ''}" id="stage-${cfg.id}"></div>
      <div class="hint" id="hint-${cfg.id}">DRAG TO SPIN</div></div>
    <div class="ctl">
      <button data-act="toggle">auto-rotate: on</button>
      <button data-act="shot">snapshot</button>
      <button data-act="style">toggle LS/SS</button>
      <button data-act="art">toggle art</button>
    </div>
    <div class="stat" id="stat-${cfg.id}"></div>`;
  row.appendChild(card);

  const el = card.querySelector('.stage');
  const api = mountSpin(el, cfg.opts);
  const hint = card.querySelector('.hint');
  api.onInteract(() => { hint.classList.add('gone'); });
  const v = { id: cfg.id, api, el, opts: { ...cfg.opts }, rotating: true, hasArt: !!cfg.opts.art };
  views.push(v);

  card.querySelector('[data-act="toggle"]').onclick = (e) => {
    v.rotating = !v.rotating; api.setAutoRotate(v.rotating);
    e.target.textContent = `auto-rotate: ${v.rotating ? 'on' : 'off'}`;
  };
  card.querySelector('[data-act="shot"]').onclick = () => shot(v, 900);
  card.querySelector('[data-act="style"]').onclick = () => {
    v.opts.style = v.opts.style === 'ls' ? 'ss' : 'ls';
    api.update({ style: v.opts.style });
  };
  card.querySelector('[data-act="art"]').onclick = () => {
    v.hasArt = !v.hasArt;
    api.update({ art: v.hasArt ? art : null });
  };
}

async function shot(v, width = 900) {
  const blob = await v.api.snapshot(width);
  if (!blob) return null;
  const img = new Image();
  img.src = URL.createObjectURL(blob);
  img.title = `${v.id} — ${(blob.size / 1024).toFixed(0)} KB`;
  document.getElementById('shots').appendChild(img);
  return blob;
}

document.getElementById('allOn').onclick = () => views.forEach(v => { v.rotating = true; v.api.setAutoRotate(true); });
document.getElementById('allOff').onclick = () => views.forEach(v => { v.rotating = false; v.api.setAutoRotate(false); });
document.getElementById('shotAll').onclick = () => views.forEach(v => shot(v, 700));
const az = deg => views.forEach(v => { v.api.setAutoRotate(false); v.rotating = false; v.api.setAzimuth(deg * Math.PI / 180); });
document.getElementById('a0').onclick = () => az(0);
document.getElementById('a45').onclick = () => az(45);
document.getElementById('a90').onclick = () => az(90);
document.getElementById('a180').onclick = () => az(180);
document.getElementById('a270').onclick = () => az(270);
document.getElementById('fpsBtn').onclick = async (e) => {
  e.target.disabled = true;
  views.forEach(v => { v.rotating = true; v.api.setAutoRotate(true); });
  const out = document.getElementById('fpsAll');
  out.textContent = 'measuring…';
  const r = await window.__spin.measureFps(3000);
  out.textContent = `rAF ${r.fps.toFixed(1)} Hz over ${Math.round(r.ms)} ms · rendered: `
    + views.map(v => `${v.id} ${v.api.getInfo().fps} fps / ${v.api.getInfo().triangles} tris`).join(' · ');
  e.target.disabled = false;
};

setInterval(() => {
  for (const v of views) {
    const i = v.api.getInfo();
    const s = document.getElementById(`stat-${v.id}`);
    if (s) s.textContent = `${i.fps} fps(rendered) · ${i.triangles} tris · ${i.drawCalls} calls · ${i.quality} · ${i.size[0]}x${i.size[1]}`;
  }
}, 500);

// ── hooks for automated screenshot verification ──
window.__spin = {
  views,
  api: id => (views.find(v => v.id === id) || views[0]).api,
  setAzimuth: (deg, id) => (id ? [views.find(v => v.id === id)] : views)
    .forEach(v => { v.api.setAutoRotate(false); v.rotating = false; v.api.setAzimuth(deg * Math.PI / 180); }),
  setPolar: (deg, id) => (id ? [views.find(v => v.id === id)] : views)
    .forEach(v => v.api.setPolar(deg * Math.PI / 180)),
  autoRotate: on => views.forEach(v => { v.rotating = !!on; v.api.setAutoRotate(!!on); }),
  info: () => views.map(v => ({ id: v.id, ...v.api.getInfo() })),
  update: (opts, id) => (id ? [views.find(v => v.id === id)] : views).forEach(v => v.api.update(opts)),
  snapshot: (id, w = 900) => shot(views.find(v => v.id === id) || views[0], w),
  /** measure fps over `ms` by counting rAF ticks (the viewers render every rAF while visible) */
  measureFps: (ms = 3000) => new Promise(res => {
    let n = 0; const t0 = performance.now();
    const step = () => { n++; (performance.now() - t0 < ms) ? requestAnimationFrame(step) : res({ frames: n, ms: performance.now() - t0, fps: n * 1000 / (performance.now() - t0) }); };
    requestAnimationFrame(step);
  }),
  dispose: () => views.forEach(v => v.api.dispose()),
  hints: () => views.map(v => ({ id: v.id, hidden: document.getElementById(`hint-${v.id}`).classList.contains('gone') })),
  fakeDrag: id => { const v = views.find(x => x.id === id) || views[0];
    v.el.querySelector('canvas').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 })); },
};
window.__spinReady = true;
</script>
</body>
</html>
