<!doctype html>
<meta charset="utf-8"><title>brand marks test</title>
<link rel="stylesheet" href="../src/brand.css">
<style>
  body{margin:0;background:#e9e9ec;font:12px system-ui;padding:8px}
  h2{margin:14px 0 6px;font:600 13px system-ui;color:#556}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .t{background:#fff;border-radius:6px;position:relative;overflow:hidden}
  .t b{position:absolute;left:6px;top:4px;font:600 10px system-ui;color:#9aa;z-index:2}
  .t svg{display:block;width:100%;height:auto}
</style>
<h2>marks — front: lockup + sleeve text (black LS) · mono + sleeves (ranked SS blue) · white LS · back print</h2>
<div class="row" id="r1"></div>
<h2>card size (lite 300): black LS · white LS · ranked purple SS · camo art + marks</h2>
<div class="row" id="r2"></div>
<script type="module">
import { renderGarment, renderRanked } from '../src/render/garment.js';
import { artPatternDef, artPatternRef, demoArt } from '../src/render/art.js';
const tile = (label, svg) => `<div class="t"><b>${label}</b>${svg}</div>`;
const M = { chest: { kind: 'lockup', color: 'auto', width: 150 }, sleeves: { text: 'PRODIGY', color: 'auto' }, back: { kind: 'word', color: 'auto', width: 250 } };
document.getElementById('r1').innerHTML =
  tile('black LS front', renderGarment({ style: 'ls', uid: 'm1', marks: M })) +
  tile('ranked SS blue mono', renderRanked({ style: 'ss', belt: 'blue', uid: 'm2', marks: { chest: { kind: 'mono', width: 56 }, sleeves: { text: 'PRODIGY', color: '#F5F3EE' } } })) +
  tile('white LS front', renderGarment({ style: 'ls', baseColor: '#ECECEA', uid: 'm3', marks: M })) +
  tile('black LS BACK', renderGarment({ style: 'ls', view: 'back', uid: 'm4', marks: M }));
const camo = demoArt('camo');
const uid = 'm8';
const defs = artPatternDef({ uid, art: camo, tile: true, transform: { scale: 0.6 } });
document.getElementById('r2').innerHTML =
  tile('lite black', renderGarment({ style: 'ls', uid: 'm5', size: 300, detail: 'lite', marks: M })) +
  tile('lite white', renderGarment({ style: 'ls', baseColor: '#ECECEA', uid: 'm6', size: 300, detail: 'lite', marks: M })) +
  tile('lite ranked purple', renderRanked({ style: 'ss', belt: 'purple', uid: 'm7', size: 300, detail: 'lite', marks: { chest: { kind: 'lockup', width: 130 }, sleeves: { text: 'PRODIGY' } } })) +
  tile('lite camo + marks', renderGarment({ style: 'ls', uid, size: 300, detail: 'lite', defs, slots: { all: artPatternRef({ uid }) }, marks: { chest: { kind: 'lockup', color: '#F5F3EE', width: 150 }, sleeves: { text: 'PRODIGY', color: '#F5F3EE' } } }));
</script>
<h2>bottoms — shorts + spats with waist/leg marks (front, back)</h2>
<div class="row" id="r3"></div>
<script type="module">
import { renderGarment } from '../src/render/garment.js';
const tile = (label, svg) => `<div class="t"><b>${label}</b>${svg}</div>`;
const B = { waist: { color: 'auto' }, leg: { color: 'auto' } };
document.getElementById('r3').innerHTML =
  tile('shorts front', renderGarment({ style: 'shorts', uid: 'b1', marks: B })) +
  tile('shorts back', renderGarment({ style: 'shorts', view: 'back', uid: 'b2', marks: B })) +
  tile('spats front', renderGarment({ style: 'spats', uid: 'b3', marks: B })) +
  tile('spats white front', renderGarment({ style: 'spats', baseColor: '#ECECEA', uid: 'b4', marks: B }));
</script>
