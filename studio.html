<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prodigy Athletics — Studio (Prototype)</title>
<meta name="description" content="Prototype studio for Prodigy Athletics — upload artwork, preview it on rashguard styles, export mockups and a flat pattern sheet. Sample data.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="src/brand.css">
<link rel="stylesheet" href="src/ui/studio.css">
</head>
<body class="surface-dark studio-body">

<header class="topbar ap-header">
  <nav class="ap-nav" aria-label="Site">
    <a class="ap-link" href="index.html">Shop</a>
    <span class="ap-link is-current" aria-current="page">Studio</span>
    <button type="button" id="sampleDataBtn" class="ap-link ap-link--btn" data-action="load-sample-data" title="Fill the current garment with sample artwork">Sample data</button>
  </nav>
  <!-- Frozen honesty disclosure. A direct child of the header, NOT of .ap-nav: the nav
       scrolls and is masked at narrow widths, which clipped this note out of sight. -->
  <span class="topbar-proto-note">Prototype &mdash; sample data, not a live tool</span>
  <a class="ap-logo" href="index.html" aria-label="Prodigy Athletics — home">
    <img src="assets/wordmark.svg" alt="Prodigy Athletics" width="200" height="38">
  </a>
</header>

<nav class="tab-strip" id="tabStrip" aria-label="Studio sections"></nav>

<!-- Dim behind the mobile bottom sheet. Tapping it closes the panel through the same
     "pointer down outside the panel" rule the rest of the page already uses. -->
<div class="sheet-scrim" id="sheetScrim" aria-hidden="true"></div>

<main class="studio-shell">
  <nav class="icon-rail" id="iconRail" aria-label="Studio panels"></nav>

  <section class="contextual-panel" id="contextualPanel" aria-label="Panel"></section>

  <section class="canvas-region" id="canvasRegion">
    <div class="view-switcher" id="viewSwitcher" role="tablist" aria-label="Canvas view"></div>
    <div class="canvas-stage-wrap">
      <div class="canvas-stage" id="canvasStage">
        <div class="canvas-shadow-note" id="canvasNote" hidden></div>
        <div id="svgHost" class="svg-host"></div>
        <div id="overlayHost" class="overlay-host" aria-hidden="true"></div>
        <div id="dragLayer" class="drag-layer" aria-hidden="true"></div>
      </div>

      <!-- Onboarding: the headline input. Hidden for the rest of the session once
           artwork has landed (studio.js: state.onboardDone). -->
      <div class="onboard" id="onboardCard" hidden>
        <div class="onboard-card" id="onboardDropZone">
          <p class="eyebrow">Step 1 &mdash; Artwork</p>
          <h2 class="onboard-title">Start with an image</h2>
          <div class="link-row">
            <label class="sr-only" for="linkInputHero">Pinterest pin or image link</label>
            <input type="url" class="link-input" id="linkInputHero" placeholder="Paste a Pinterest pin or image link&hellip;" autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn--primary" data-action="fetch-link">Fetch</button>
          </div>
          <div class="link-status" aria-live="polite"></div>
          <p class="onboard-alt">or drop / paste (Ctrl+V) an image anywhere</p>
          <div class="onboard-samples">
            <span class="onboard-alt onboard-alt--tight">No artwork to hand? Sample art:</span>
            <div class="sample-buttons">
              <button type="button" data-action="use-demo" data-kind="geo">Geo</button>
              <button type="button" data-action="use-demo" data-kind="camo">Camo</button>
              <button type="button" data-action="use-demo" data-kind="mark">Mark</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="cutsheet-notes" id="cutsheetNotes" hidden></div>
  </section>

  <aside class="scenes-rail" id="scenesRail" aria-label="Export scenes"></aside>
</main>

<div class="crop-modal-backdrop" id="cropModal" hidden>
  <div class="crop-modal" role="dialog" aria-modal="true" aria-label="Crop artwork">
    <h3>Crop artwork</h3>
    <div class="crop-body">
      <div class="crop-stage-wrap">
        <div class="crop-stage" id="cropStage">
          <img id="cropImg" alt="Uploaded artwork">
          <div class="crop-box" id="cropBox">
            <div class="crop-handle" data-corner="nw"></div>
            <div class="crop-handle" data-corner="ne"></div>
            <div class="crop-handle" data-corner="se"></div>
            <div class="crop-handle" data-corner="sw"></div>
          </div>
        </div>
      </div>
      <div class="crop-side">
        <label class="crop-square-toggle"><input type="checkbox" id="cropSquare" checked> Square crop</label>
        <div class="crop-preview-label">Live preview</div>
        <div class="crop-preview" id="cropPreview"></div>
      </div>
    </div>
    <div class="crop-actions">
      <button type="button" class="btn btn--secondary" id="cropCancel">Cancel</button>
      <button type="button" class="btn btn--secondary" id="cropFull">Use full image</button>
      <button type="button" class="btn btn--primary" id="cropApply">Apply crop</button>
    </div>
  </div>
</div>

<div id="toastHost" class="toast-host" aria-live="polite"></div>

<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="src/ui/studio.js"></script>
</body>
</html>
